<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用型在线Excel合并工具 (含动态可视化)</title>
    <!-- 引入Tailwind CSS框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入SheetJS/xlsx库用于处理Excel文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .file-input-label { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 0.5rem; background-color: #4f46e5; color: white; font-weight: 600; transition: background-color 0.2s; }
        .file-input-label:hover { background-color: #4338ca; }
        input[type="file"] { display: none; }
        .disabled-btn { background-color: #9ca3af; cursor: not-allowed; }
        .config-section { display: none; }
        .table-select { width: 100%; padding: 0.5rem; border-radius: 0.375rem; border: 1px solid #d1d5db; background-color: white; }
        /* 可视化字段样式 */
        .field-box { 
            background-color: white; 
            border: 1px solid #e5e7eb; 
            border-radius: 0.375rem; 
            padding: 0.5rem 0.75rem; 
            margin: 0 auto 0.5rem auto; /* 自动居中并保持底部边距 */
            font-size: 0.875rem; 
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            max-width: 90%; /* **UPDATED**: 缩小宽度 */
            min-height: 38px; /* 确保占位符和实体块高度一致 */
        }
        .field-box.source-1 { border-left: 4px solid #3b82f6; }
        .field-box.source-2 { border-left: 4px solid #10b981; }
        .field-box.target { border-left: 4px solid #8b5cf6; border-right: 4px solid #8b5cf6;}
        .connector-line { stroke-width: 2; fill: none; stroke-linecap: round; opacity: 0.8; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="p-6 sm:p-8">
                <!-- 标题 -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">通用型在线Excel合并工具</h1>
                    <p class="mt-2 text-gray-600">自定义合并规则，并通过实时可视化预览映射关系。</p>
                </div>

                <!-- 步骤1: 上传文件 -->
                <h2 class="text-xl font-bold text-gray-700 mb-4 border-l-4 border-indigo-500 pl-3">步骤 1: 上传文件</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <!-- 卡片们 -->
                    <div id="card-source1" class="bg-gray-50 p-6 rounded-lg border-2 border-dashed border-gray-300 text-center transition-all duration-300"><h3 class="font-semibold text-lg text-gray-700 mb-2">源文件 1</h3><label for="source1File" class="file-input-label">选择文件</label><input type="file" id="source1File" accept=".xlsx, .xls"><p id="source1FileName" class="mt-3 text-sm text-green-600 font-medium"></p></div>
                    <div id="card-source2" class="bg-gray-50 p-6 rounded-lg border-2 border-dashed border-gray-300 text-center transition-all duration-300"><h3 class="font-semibold text-lg text-gray-700 mb-2">源文件 2</h3><label for="source2File" class="file-input-label">选择文件</label><input type="file" id="source2File" accept=".xlsx, .xls"><p id="source2FileName" class="mt-3 text-sm text-green-600 font-medium"></p></div>
                    <div id="card-template" class="bg-gray-50 p-6 rounded-lg border-2 border-dashed border-gray-300 text-center transition-all duration-300"><h3 class="font-semibold text-lg text-gray-700 mb-2">目标模板</h3><label for="templateFile" class="file-input-label">选择文件</label><input type="file" id="templateFile" accept=".xlsx, .xls"><p id="templateFileName" class="mt-3 text-sm text-green-600 font-medium"></p></div>
                </div>

                <!-- 步骤2: 配置合并规则 -->
                <div id="config-section" class="config-section mb-8">
                    <h2 class="text-xl font-bold text-gray-700 mb-4 border-l-4 border-indigo-500 pl-3">步骤 2: 配置合并规则</h2>
                    <div class="bg-slate-50 p-6 rounded-lg">
                        <!-- **UPDATED**: Replaced input with select -->
                        <div class="mb-6"><label for="mergeKeySelect" class="block text-md font-medium text-gray-800 mb-2">选择合并主键 (已自动推荐可靠主键)</label><select id="mergeKeySelect" class="w-full md:w-1/2 p-2 border border-gray-300 rounded-md bg-white"></select></div>
                        <div>
                            <h3 class="text-md font-medium text-gray-800 mb-3">定义字段映射关系 (已自动匹配同名字段)</h3>
                            <div class="overflow-x-auto"><table class="min-w-full bg-white border"><thead class="bg-gray-200"><tr><th class="text-left py-2 px-3">目标模板字段</th><th class="text-left py-2 px-3">映射到 源文件 1</th><th class="text-left py-2 px-3">映射到 源文件 2</th><th class="text-left py-2 px-3">数据源优先级</th></tr></thead><tbody id="mapping-table-body"></tbody></table></div>
                        </div>
                    </div>
                </div>
                
                <!-- 步骤3: 可视化预览 -->
                <div id="visualization-section" class="config-section mb-8">
                    <h2 class="text-xl font-bold text-gray-700 mb-4 border-l-4 border-indigo-500 pl-3">步骤 3: 可视化预览</h2>
                    <div id="mapping-container" class="relative grid grid-cols-3 gap-4 text-sm bg-slate-50 p-6 rounded-lg">
                        <div class="space-y-2"><h3 class="font-bold mb-2 text-center text-blue-600">源文件 1 字段</h3><div id="vis-col-source1"></div></div>
                        <div class="space-y-2"><h3 class="font-bold mb-2 text-center text-purple-600">目标模板字段</h3><div id="vis-col-template"></div></div>
                        <div class="space-y-2"><h3 class="font-bold mb-2 text-center text-green-600">源文件 2 字段</h3><div id="vis-col-source2"></div></div>
                        <svg id="mapping-svg" class="absolute top-0 left-0 w-full h-full" style="pointer-events: none;"></svg>
                    </div>
                </div>

                <!-- 步骤4: 执行合并 -->
                <div id="merge-section" class="config-section text-center">
                     <h2 class="text-xl font-bold text-gray-700 mb-4 border-l-4 border-indigo-500 pl-3">步骤 4: 生成文件</h2>
                    <button id="mergeBtn" class="w-full md:w-1/2 bg-green-600 text-white font-bold py-3 px-6 rounded-lg text-lg hover:bg-green-700 transition-all duration-300 shadow-md disabled-btn" disabled>开始合并并下载</button>
                    <p id="status" class="mt-4 text-gray-600 h-6"></p>
                </div>
            </div>
        </div>
        <footer class="text-center mt-8 text-sm text-gray-500"><p>&copy; 2024 通用型在线Excel合并工具。所有文件处理均在您的浏览器本地完成。</p></footer>
    </div>

    <script>
        // --- 全局状态 ---
        const fileInputs = { source1: document.getElementById('source1File'), source2: document.getElementById('source2File'), template: document.getElementById('templateFile') };
        const fileData = { source1: null, source2: null, template: null };
        const fileHeaders = { source1: [], source2: [], template: [] };

        // --- DOM 元素 ---
        const mergeBtn = document.getElementById('mergeBtn');
        const statusEl = document.getElementById('status');
        const configSections = document.querySelectorAll('.config-section');

        // --- 事件监听 ---
        Object.keys(fileInputs).forEach(key => fileInputs[key].addEventListener('change', (e) => handleFileSelect(e, key)));
        mergeBtn.addEventListener('click', handleMerge);
        window.addEventListener('resize', () => { if(fileData.template) updateVisualization(); });

        // --- 函数定义 ---
        /** 读取Excel文件并提取数据和表头 */
        function readExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        const headers = jsonData.length > 0 ? Object.keys(jsonData[0]) : (XLSX.utils.sheet_to_json(worksheet, { header: 1 })[0] || []);
                        resolve({ data: jsonData, headers });
                    } catch (err) { reject(new Error(`解析文件 "${file.name}" 失败: ${err.message}`)); }
                };
                reader.onerror = () => reject(new Error(`读取文件 "${file.name}" 失败.`));
                reader.readAsArrayBuffer(file);
            });
        }

        /** 处理文件选择 */
        async function handleFileSelect(event, key) {
            const file = event.target.files[0];
            const card = document.getElementById(`card-${key}`);
            const fileNameEl = document.getElementById(`${key}FileName`);
            if (!file) {
                fileNameEl.textContent = '';
                card.classList.remove('border-green-500', 'bg-green-50');
                return;
            }
            fileNameEl.textContent = '读取中...';
            card.classList.add('border-yellow-500');
            try {
                const { data, headers } = await readExcel(file);
                fileData[key] = data;
                fileHeaders[key] = headers;
                fileNameEl.textContent = file.name;
                card.classList.remove('border-yellow-500', 'border-gray-300');
                card.classList.add('border-green-500', 'bg-green-50');
                checkAllFilesUploaded();
            } catch (error) {
                statusEl.textContent = error.message;
                statusEl.className = 'mt-4 text-red-600 h-6';
                fileNameEl.textContent = '读取失败';
                card.classList.remove('border-yellow-500', 'border-green-500');
                card.classList.add('border-red-500');
            }
        }
        
        /** 检查所有文件是否上传完毕 */
        function checkAllFilesUploaded() {
            if (fileData.source1 && fileData.source2 && fileData.template) {
                setupConfigUI();
            }
        }

        /** 设置配置UI界面 */
        function setupConfigUI() {
            configSections.forEach(s => s.style.display = 'block');
            mergeBtn.disabled = false;
            mergeBtn.classList.remove('disabled-btn');
            statusEl.textContent = '请配置合并规则后，点击按钮开始合并。';
            statusEl.className = 'mt-4 text-blue-600 h-6';

            // **UPDATED**: Smart primary key detection and population into a <select> element
            const commonHeaders = fileHeaders.source1.filter(h => fileHeaders.source2.includes(h));
            const candidateKeys = commonHeaders.filter(h => {
                const isKeyValidInSource1 = fileData.source1.every(row => row[h] !== null && row[h] !== undefined && String(row[h]).trim() !== '');
                const isKeyValidInSource2 = fileData.source2.every(row => row[h] !== null && row[h] !== undefined && String(row[h]).trim() !== '');
                return isKeyValidInSource1 && isKeyValidInSource2;
            });

            const selectEl = document.getElementById('mergeKeySelect');
            selectEl.innerHTML = ''; // Clear previous options
            if (candidateKeys.length > 0) {
                candidateKeys.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h;
                    option.textContent = h;
                    selectEl.appendChild(option);
                });
            } else {
                // If no reliable keys, populate with all common headers as a fallback
                const fallbackOption = document.createElement('option');
                fallbackOption.value = "";
                fallbackOption.textContent = "未找到可靠主键，请手动选择";
                selectEl.appendChild(fallbackOption);
                commonHeaders.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h;
                    option.textContent = h + " (可能含空值)";
                    selectEl.appendChild(option);
                });
                statusEl.textContent = '警告: 未找到可靠的合并主键 (在两表中都存在且无空值)。请手动选择。';
                statusEl.className = 'mt-4 text-orange-600 h-6';
            }

            setupMappingTable();
            updateVisualization();
        }

        /** 设置映射表格 */
        function setupMappingTable() {
            const tableBody = document.getElementById('mapping-table-body');
            tableBody.innerHTML = '';
            fileHeaders.template.forEach(targetHeader => {
                const row = document.createElement('tr');
                row.className = 'border-t';
                row.innerHTML = `<td class="py-2 px-3 font-medium">${targetHeader}</td>`;
                ['source1', 'source2'].forEach(sourceKey => {
                    const td = document.createElement('td');
                    td.className = 'py-2 px-3';
                    const select = createSelect(fileHeaders[sourceKey], targetHeader);
                    select.addEventListener('change', updateVisualization);
                    td.appendChild(select);
                    row.appendChild(td);
                });
                
                const priorityTd = document.createElement('td');
                priorityTd.className = 'py-2 px-3';
                const prioritySelect = document.createElement('select');
                prioritySelect.className = 'table-select priority-select';
                prioritySelect.innerHTML = `<option value="source2">优先 源文件 2</option><option value="source1">优先 源文件 1</option>`;
                priorityTd.appendChild(prioritySelect);
                row.appendChild(priorityTd);

                tableBody.appendChild(row);
            });
        }
        
        /** 创建下拉选择框 */
        function createSelect(headers, targetHeader) {
            const select = document.createElement('select');
            select.className = 'table-select';
            select.innerHTML = `<option value="">-- 不映射 --</option>`;
            headers.forEach(h => {
                const option = document.createElement('option');
                option.value = h;
                option.textContent = h;
                if (h === targetHeader) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
            return select;
        }

        /** 更新整个可视化区域（字段块和连接线） */
        function updateVisualization() {
            redrawFieldBoxes();
            drawAllConnections();
        }

        /** 重绘所有字段块以实现对齐 */
        function redrawFieldBoxes() {
            const visCols = {
                source1: document.getElementById('vis-col-source1'),
                template: document.getElementById('vis-col-template'),
                source2: document.getElementById('vis-col-source2'),
            };
            Object.values(visCols).forEach(col => col.innerHTML = ''); // 清空所有列

            const mappingRows = document.getElementById('mapping-table-body').rows;

            for (const row of mappingRows) {
                const targetHeader = row.cells[0].textContent;
                const source1Mapping = row.cells[1].querySelector('select').value;
                const source2Mapping = row.cells[2].querySelector('select').value;

                const targetBox = createFieldBox('template', targetHeader);
                visCols.template.appendChild(targetBox);

                const source1Box = source1Mapping ? createFieldBox('source1', source1Mapping) : createPlaceholder();
                visCols.source1.appendChild(source1Box);

                const source2Box = source2Mapping ? createFieldBox('source2', source2Mapping) : createPlaceholder();
                visCols.source2.appendChild(source2Box);
            }
        }

        /** 创建单个字段块的辅助函数 */
        function createFieldBox(type, header) {
            const div = document.createElement('div');
            let className = 'field-box';
            if (type === 'source1') className += ' source-1';
            else if (type === 'source2') className += ' source-2';
            else if (type === 'template') className += ' target';
            
            div.className = className;
            div.id = `vis-${type}-${header}`;
            div.textContent = header;
            div.title = header;
            return div;
        }

        /** 创建占位符以保持对齐 */
        function createPlaceholder() {
            const div = document.createElement('div');
            div.className = 'field-box invisible'; // `invisible` 使其不显示但仍占据空间
            return div;
        }

        /** 绘制所有连接线 */
        function drawAllConnections() {
            const svg = document.getElementById('mapping-svg');
            if (!svg) return;
            svg.innerHTML = '';
            const rows = document.getElementById('mapping-table-body').rows;

            for (const row of rows) {
                const targetHeader = row.cells[0].textContent;
                const source1Mapping = row.cells[1].querySelector('select').value;
                const source2Mapping = row.cells[2].querySelector('select').value;
                
                const toEl = document.getElementById(`vis-template-${targetHeader}`);
                if (!toEl) continue;

                if (source1Mapping) {
                    const fromEl = document.getElementById(`vis-source1-${source1Mapping}`);
                    if(fromEl) drawConnection(svg, fromEl, toEl, '#3b82f6');
                }
                if (source2Mapping) {
                    const fromEl = document.getElementById(`vis-source2-${source2Mapping}`);
                    if(fromEl) drawConnection(svg, fromEl, toEl, '#10b981');
                }
            }
        }

        /** 绘制单条连接线 */
        function drawConnection(svg, fromEl, toEl, color) {
            const containerRect = document.getElementById('mapping-container').getBoundingClientRect();
            const fromRect = fromEl.getBoundingClientRect();
            const toRect = toEl.getBoundingClientRect();

            if (fromRect.width === 0 || toRect.width === 0) return;

            let startX, endX, controlX1, controlX2;
            const startY = fromRect.top + fromRect.height / 2 - containerRect.top;
            const endY = toRect.top + toRect.height / 2 - containerRect.top;
            
            if (fromRect.x < toRect.x) { // 源在左侧
                startX = fromRect.right - containerRect.left;
                endX = toRect.left - containerRect.left;
                controlX1 = startX + 60;
                controlX2 = endX - 60;
            } else { // 源在右侧
                startX = fromRect.left - containerRect.left;
                endX = toRect.right - containerRect.left;
                controlX1 = startX - 60;
                controlX2 = endX + 60;
            }

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${startX} ${startY} C ${controlX1} ${startY}, ${controlX2} ${endY}, ${endX} ${endY}`);
            path.setAttribute('stroke', color);
            path.classList.add('connector-line');
            svg.appendChild(path);
        }

        /** 主合并逻辑 */
        async function handleMerge() {
            mergeBtn.disabled = true;
            mergeBtn.classList.add('disabled-btn');
            statusEl.textContent = '正在处理...';
            statusEl.className = 'mt-4 text-yellow-600 h-6 animate-pulse';

            try {
                // **UPDATED**: Get value from select element
                const mergeKey = document.getElementById('mergeKeySelect').value;
                if (!mergeKey) throw new Error('必须指定一个合并主键。');

                const mappingConfig = {};
                const rows = document.getElementById('mapping-table-body').rows;
                for (const row of rows) {
                    mappingConfig[row.cells[0].textContent] = {
                        source1: row.cells[1].querySelector('select').value,
                        source2: row.cells[2].querySelector('select').value,
                        priority: row.cells[3].querySelector('select').value,
                    };
                }

                const mergedDataMap = new Map();
                fileData.source1.forEach(row => {
                    const key = String(row[mergeKey] || '').trim();
                    if (key) mergedDataMap.set(key, { source1: row });
                });
                fileData.source2.forEach(row => {
                    const key = String(row[mergeKey] || '').trim();
                    const existing = mergedDataMap.get(key) || {};
                    mergedDataMap.set(key, { ...existing, source2: row });
                });
                
                const finalData = [];
                for (const data of mergedDataMap.values()) {
                    const newRow = {};
                    for (const targetHeader of fileHeaders.template) {
                        const mapping = mappingConfig[targetHeader];
                        const val1 = data.source1 && mapping.source1 ? data.source1[mapping.source1] : undefined;
                        const val2 = data.source2 && mapping.source2 ? data.source2[mapping.source2] : undefined;
                        
                        let finalValue;
                        const hasVal1 = val1 !== undefined && val1 !== null && val1 !== '';
                        const hasVal2 = val2 !== undefined && val2 !== null && val2 !== '';

                        if (mapping.priority === 'source1') {
                            finalValue = hasVal1 ? val1 : val2;
                        } else {
                            finalValue = hasVal2 ? val2 : val1;
                        }
                        
                        newRow[targetHeader] = (finalValue !== undefined && finalValue !== null) ? finalValue : '';
                    }
                    finalData.push(newRow);
                }

                statusEl.textContent = '合并完成，正在生成Excel文件...';
                const finalWorksheet = XLSX.utils.json_to_sheet(finalData, { header: fileHeaders.template });
                const finalWorkbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(finalWorkbook, finalWorksheet, '合并结果');
                XLSX.writeFile(finalWorkbook, 'merged_records_generic.xlsx');

                statusEl.textContent = `处理成功！共合并 ${finalData.length} 条记录。`;
                statusEl.className = 'mt-4 text-green-600 h-6';

            } catch (error) {
                console.error(error);
                statusEl.textContent = `错误: ${error.message}`;
                statusEl.className = 'mt-4 text-red-600 h-6';
            } finally {
                mergeBtn.disabled = false;
                mergeBtn.classList.remove('disabled-btn');
                statusEl.classList.remove('animate-pulse');
            }
        }
    </script>
</body>
</html>
